name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - elixir: '1.18'
            otp: '27'
          - elixir: '1.19'
            otp: '28'
          - elixir: '1.20'
            otp: '29'
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - run: mix deps.get
      - run: mix hex.audit
      - run: mix test --warnings-as-errors
      - if: matrix.elixir == '1.20'
        run: mix format --check-formatted

  resource-limits:
    runs-on: ubuntu-latest
    env:
      ERL_FLAGS: '+S 4:4 +A 4'
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.20'
          otp-version: '29'
      - run: mix deps.get
      - run: |
          ulimit -n 256
          mix test --only resource --warnings-as-errors
